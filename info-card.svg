.key{fill:#58a6ff}.val{fill:#e6edf3}.row{opacity:0;animation:in .42s ease-out forwards}
@keyframes in{0%{opacity:0;transform:translateY(7px)}100%{opacity:1;transform:translateY(0)}}
.cursor{animation:blink .8s steps(1,end) infinite}@keyframes blink{50%{opacity:0}}
